name: CI

on:
  push:
    branches-ignore: [data]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Collector tests
        run: python3 -m unittest discover -s collector -v
      - run: npm run build
